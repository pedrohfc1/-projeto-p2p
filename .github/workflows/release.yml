name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            test "$REF_TYPE" = tag
            python3 scripts/check-version.py "$REF_NAME"
          else
            python3 scripts/check-version.py
          fi
          echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
  validate-and-build:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  assemble:
    # Build artifacts remain downloadable when the security gate blocks release.
    if: always() && needs.version.result == 'success'
    needs: [version, validate-and-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-Windows
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-Linux
          path: dist/release
      - name: Source, inventory and checksums
        run: |
          v=$(cat VERSION)
          test -f "dist/release/ProjetoP2P-Setup-v$v.exe"
          test -f "dist/release/ProjetoP2P-v$v-linux-amd64.tar.gz"
          python3 scripts/package-distribution.py source
          python3 scripts/package-distribution.py checksums
          (cd dist/release && sha256sum --check SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    # Dispatch only builds artifacts. Only a tag push may publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.validate-and-build.result == 'success'
    needs: [version, assemble, validate-and-build]
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: packages
      - name: Publish exact tag (never replace an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          (cd packages && sha256sum --check SHA256SUMS.txt)
          gh release create "$TAG" packages/* --verify-tag --generate-notes --title "Projeto P2P $TAG" --latest
